services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careergraph
      POSTGRES_DB: careergraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U careergraph"]
      interval: 3s
      retries: 30
      timeout: 3s
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://careergraph:${POSTGRES_PASSWORD}@db/careergraph
    depends_on: {db: {condition: service_healthy}}
    command: ["sh","-ec","alembic -c apps/api/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 24
    volumes: [model:/root/.cache/huggingface]
    ports: ["127.0.0.1:8000:8000"]
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {api: {condition: service_healthy}}
volumes:
  pgdata: {}
  model: {}
